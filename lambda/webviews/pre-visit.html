<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{BRAND_NAME}} — Pre-Visit Checklist</title>
<style>
  :root { --accent: {{ACCENT}}; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Helvetica, Arial, sans-serif; color: #1a1a1a; background: #f6f8f8; }
  header { background: var(--accent); color: #fff; padding: 20px 18px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 13px; }
  main { padding: 18px; }
  .item { display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1px solid #e4e9e9;
          border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .item input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
  .item label { font-size: 15px; line-height: 1.35; }
  .note { color: #667; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
  <header>
    <h1>Pre-Visit Checklist</h1>
    <p>{{BRAND_NAME}} — Annual Physical Exam</p>
  </header>
  <main>
    <div class="item"><input type="checkbox" id="c1"><label for="c1">Bring your insurance card and photo ID</label></div>
    <div class="item"><input type="checkbox" id="c2"><label for="c2">Arrive 15 minutes early for check-in</label></div>
    <div class="item"><input type="checkbox" id="c3"><label for="c3">Fast for 12 hours if bloodwork is ordered</label></div>
    <div class="item"><input type="checkbox" id="c4"><label for="c4">List any new medications or symptoms</label></div>
    <div class="item"><input type="checkbox" id="c5"><label for="c5">Note questions you want to ask your provider</label></div>
    <p class="note">This checklist is a demo webview opened inside the RCS conversation.</p>
  </main>
</body>
</html>
