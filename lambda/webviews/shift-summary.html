<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{BRAND_NAME}} — Shift Summary</title>
<style>
  :root { --accent: {{ACCENT}}; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Helvetica, Arial, sans-serif; color: #1a1a1a; background: #f6f8f8; }
  header { background: var(--accent); color: #fff; padding: 20px 18px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 13px; }
  main { padding: 18px; }
  .card { background: #fff; border: 1px solid #e4e9e9; border-radius: 10px; padding: 16px; }
  .row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #eef2f2; font-size: 15px; }
  .row:last-child { border-bottom: 0; }
  .row span:first-child { color: #667; }
  .row span:last-child { font-weight: 600; }
  .note { color: #667; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
  <header>
    <h1>Shift Summary</h1>
    <p>{{BRAND_NAME}} — Today's shift</p>
  </header>
  <main>
    <div class="card">
      <div class="row"><span>Location</span><span>AnyHealth Chestnut St Clinic</span></div>
      <div class="row"><span>Clocked in</span><span>9:02 AM</span></div>
      <div class="row"><span>Clocked out</span><span>5:00 PM</span></div>
      <div class="row"><span>Duration</span><span>7h 58m</span></div>
    </div>
    <p class="note">This summary is a demo webview opened inside the RCS conversation.</p>
  </main>
</body>
</html>
